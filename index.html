<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffcf00"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Steinwerk"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<title>Steinwerk – Sets wieder aufbauen</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: werkstattnah, klar, freundlich – ein Sortiertisch, kein Shop
   IDEA: die Bauteil-Kiste mit Inventarliste – jedes Set ist ein Fach mit Füllstand
   PICTURE: das Raster der Set-Fächer mit Füllstandsbalken ist das Bild
   COLOUR+TYPE: Stein-Gelb dominant, Tinte, Rot als Akzent; Archivo 900 + Inter
   LAYOUT: Kopfband gelb, darunter Werkzeugleiste, dann Fächer-Raster; Detail als Teileliste */
:root{color-scheme:light dark;--bg:light-dark(#f7f6f2,#121215);--card:light-dark(#fff,#1d1d22);--ink:light-dark(#18181c,#f1f0ea);--mute:light-dark(#62626b,#a3a3ad);--line:light-dark(#e3e1d9,#2e2e36);--y:#ffcf00;--yd:#e6b800;--r:#d4262c;--g:#1f8a4c;--field:light-dark(#fff,#16161a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Archivo,Inter,sans-serif;line-height:1.08;margin:0;text-wrap:balance}
a{color:inherit}
.top{background:var(--y);color:#18181c;padding:calc(18px + env(safe-area-inset-top)) max(4vw,16px,env(safe-area-inset-right)) 0 max(4vw,16px,env(safe-area-inset-left))}
@media(max-width:600px){.brand p{display:none}.brand h1{font-size:26px}main{padding-bottom:calc(60px + env(safe-area-inset-bottom))}}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand h1{font-size:clamp(28px,4vw,40px);font-weight:900;letter-spacing:-.02em}
.brand p{margin:0;font-size:15px;opacity:.8}
.studs{display:inline-grid;grid-template-columns:repeat(4,12px);gap:4px;background:var(--r);padding:6px;border-radius:5px}
.studs i{width:12px;height:12px;border-radius:50%;background:#ef4a4f;box-shadow:inset 0 -2px 0 #9e1a1f}
nav{display:flex;gap:4px;margin-top:14px;overflow-x:auto}
nav button{flex:none;border:0;background:transparent;font:600 15px Inter,sans-serif;padding:12px 16px;border-radius:10px 10px 0 0;cursor:pointer;color:#18181c;min-height:44px}
nav button[aria-current=true]{background:var(--bg);color:var(--ink)}
main{max-width:1240px;margin:0 auto;padding:24px max(4vw,16px) 60px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
input,select,textarea{font:16px Inter,sans-serif;color:var(--ink);background:var(--field);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--r);outline-offset:2px}
.grow{flex:1 1 240px}
.btn{font:600 15px Inter,sans-serif;border:0;border-radius:10px;padding:10px 16px;min-height:44px;cursor:pointer;background:var(--ink);color:var(--bg);display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn.y{background:var(--y);color:#18181c}.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}.btn.red{background:var(--r);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px}
.panel h2{font-size:22px;margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat b{display:block;font:900 clamp(26px,3vw,34px) Archivo,sans-serif}
.stat span{color:var(--mute);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.card .im{background:#fff;aspect-ratio:4/3;display:grid;place-items:center;position:relative}
.card .im img{max-width:90%;max-height:90%;object-fit:contain}
.badge{position:absolute;left:10px;top:10px;background:var(--y);color:#18181c;font:800 13px Archivo,sans-serif;padding:3px 8px;border-radius:6px}
.st{position:absolute;right:10px;top:10px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;background:#18181c;color:#fff}
.st.komplett{background:var(--g)}.st.arbeit{background:var(--r)}
.card .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:17px}
.sub{color:var(--mute);font-size:13px}
.meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--y);border-radius:5px}
.meter.done i{background:var(--g)}
.row{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--mute)}
.empty{text-align:center;padding:40px 16px;color:var(--mute)}
.empty h2{color:var(--ink);font-size:26px;margin-bottom:8px}
ol.steps{padding-left:20px;margin:8px 0}ol.steps li{margin:4px 0}
.det{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:22px;align-items:start}
.det .im{background:#fff;border-radius:16px;border:1px solid var(--line);aspect-ratio:4/3;display:grid;place-items:center}
.det .im img{max-width:92%;max-height:92%;object-fit:contain}
.det h2{font-size:clamp(26px,3.4vw,40px);margin:4px 0 6px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}
.chk{display:flex!important;flex-direction:row!important;align-items:center;gap:8px;font-size:15px!important;color:var(--ink)!important}
.chk input{min-height:auto;width:20px;height:20px}
.big{font:900 clamp(30px,4vw,44px) Archivo,sans-serif}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:13px;color:var(--mute);font-weight:600}
td.num,th.num{text-align:right;white-space:nowrap}
tr.ok{opacity:.55}tr.ok td:first-child{box-shadow:inset 4px 0 0 var(--g)}
tr.miss td:first-child{box-shadow:inset 4px 0 0 var(--r)}
.pi{width:64px}.pi img{width:52px;height:52px;object-fit:contain;background:#fff;border-radius:8px;display:block}
.noimg{display:block;width:52px;height:52px;border-radius:8px;background:var(--line)}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.25);vertical-align:-2px;margin-right:6px}
.ctl{white-space:nowrap;text-align:right}
.ctl button{width:40px;height:40px;border:1.5px solid var(--line);background:var(--field);color:var(--ink);border-radius:8px;font-size:18px;cursor:pointer}
.ctl input{width:62px;text-align:center;padding:6px;min-height:40px}
.scroll{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#18181c;color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;max-width:min(560px,92vw);z-index:9;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.toast.err{background:var(--r)}
.busy{display:inline-flex;align-items:center;gap:8px;color:var(--mute);font-size:14px}
.busy:not(:empty)::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid var(--yd);border-top-color:transparent;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.busy::before{animation:none}.card{transition:none}}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:14px}
.ritem{display:flex;flex-direction:column;gap:8px;background:var(--bg);border-radius:14px;padding:10px}
.ritem .rim{background:#fff;border-radius:10px;aspect-ratio:4/3;display:grid;place-items:center;cursor:zoom-in}
.ritem .rim img{max-width:94%;max-height:94%;object-fit:contain}
.ritem .btn{align-self:flex-start}
.modes{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
.modes button{font:600 15px Inter,sans-serif;min-height:44px;padding:8px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer}
.modes button[aria-pressed=true]{background:var(--y);border-color:var(--yd);color:#18181c}
.drop{display:grid;place-items:center;text-align:center;gap:8px;border:2.5px dashed var(--yd);border-radius:16px;padding:32px 16px;cursor:pointer;background:var(--bg);min-height:180px}
.drop.over{background:color-mix(in srgb,var(--y) 18%,var(--bg))}
.drop b{font:800 20px Archivo,sans-serif}
.phwrap{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:20px;align-items:start;margin-top:18px}
.phwrap>img{width:100%;border-radius:14px;background:#fff;border:1px solid var(--line)}
.pred{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.pred .hd{display:flex;gap:14px;align-items:center}
.pred .hd img{width:110px;height:110px;object-fit:contain;background:#fff;border-radius:10px;flex:none}
.score{display:inline-block;font:800 13px Archivo,sans-serif;padding:2px 8px;border-radius:6px;background:var(--y);color:#18181c}
.score.lo{background:var(--line);color:var(--ink)}
.pred ul{list-style:none;margin:10px 0 0;padding:0}
.pred li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);flex-wrap:wrap}
@media(max-width:700px){.phwrap{grid-template-columns:1fr}}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.8);display:grid;place-items:center;z-index:10;cursor:zoom-out;padding:4vw}
.zoom img{max-width:100%;max-height:100%;background:#fff;border-radius:14px;padding:12px}
.hit{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.hit .hd{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.hit .hd img{width:56px;height:56px;object-fit:contain;background:#fff;border-radius:8px}
.hit li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.hit ul{list-style:none;margin:0;padding:0}
small.note{color:var(--mute);font-size:13px}
@media(max-width:700px){.det{grid-template-columns:1fr}}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;grid-template-columns:64px 1fr;padding-block:8px;column-gap:8px}.stack td{border:0;padding:2px 0}.stack td.pi{grid-row:span 4}.stack td.num{text-align:left}.stack td.num::before{content:"benötigt: ";color:var(--mute)}.stack td.ctl{text-align:left}}
</style></head><body>
<header class="top">
  <div class="brand"><span class="studs" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <div><h1>Steinwerk</h1><p>Sets erfassen, Teile abhaken, Anleitungen finden – und alles wieder aufbauen.</p></div></div>
  <nav id="nav">
    <button data-view="sets">Meine Sets</button><button data-view="photo">Foto erkennen</button><button data-view="search">Teilesuche</button>
    <button data-view="missing">Fehlteile</button><button data-view="settings">Einstellungen</button>
  </nav>
</header>
<main id="app"></main>
<div id="toast" class="toast" hidden></div>
<input type="file" id="imp" accept=".json,application/json" hidden>
<input type="file" id="phf" accept="image/*" capture="environment" multiple hidden>
<script>
{
const RB='https://rebrickable.com/api/v3/lego';
const S={key:'',sets:{},themes:{}};
let db=null,view='sets',cur=null,busyMsg='',filt={q:'',st:'',sort:'near'},pf={q:'',miss:false,spare:false,sort:'color'},sq='',mscope='open',searchRes=[];
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fmt=n=>n.toLocaleString('de-DE');

/* ---------- Speicher (IndexedDB) ---------- */
function openDB(){return new Promise(res=>{try{const r=indexedDB.open('steinwerk',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('sets',{keyPath:'set_num'});d.createObjectStore('meta')};r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}})}
const reqP=r=>new Promise(res=>{r.onsuccess=()=>res(r.result);r.onerror=()=>res(undefined)});
const getAll=()=>db?reqP(db.transaction('sets').objectStore('sets').getAll()):Promise.resolve([]);
const getMeta=k=>db?reqP(db.transaction('meta').objectStore('meta').get(k)):Promise.resolve(undefined);
function putMeta(k,v){if(db)db.transaction('meta','readwrite').objectStore('meta').put(v,k)}
function putSet(s){if(db)db.transaction('sets','readwrite').objectStore('sets').put(s)}
function delSet(n){if(db)db.transaction('sets','readwrite').objectStore('sets').delete(n)}
const dirty=new Set();let svT;
function save(s){dirty.add(s.set_num);clearTimeout(svT);svT=setTimeout(flush,350)}
function flush(){for(const n of dirty)if(S.sets[n])putSet(S.sets[n]);dirty.clear()}
addEventListener('pagehide',flush);

/* ---------- Rebrickable-API ---------- */
let queue=Promise.resolve(),last=0;
function api(path){const p=queue.then(()=>call(path));queue=p.catch(()=>{});return p}
async function call(path){
  if(!S.key)throw new Error('Kein API-Schlüssel hinterlegt – bitte unter „Einstellungen“ eintragen.');
  let url=path.startsWith('http')?path:RB+path;
  if(!/[?&]key=/.test(url))url+=(url.includes('?')?'&':'?')+'key='+encodeURIComponent(S.key);
  for(let a=0;a<4;a++){
    const w=last+1100-Date.now();if(w>0)await sleep(w);last=Date.now();
    let r;try{r=await fetch(url)}catch(e){throw new Error('Keine Verbindung zu Rebrickable. Internet prüfen und die Datei direkt im Browser öffnen (nicht in einer Vorschau).')}
    if(r.status===429){await sleep(2500*(a+1));continue}
    if(r.status===404)throw new Error('nicht gefunden');
    if(r.status===401||r.status===403)throw new Error('API-Schlüssel ungültig');
    if(!r.ok)throw new Error('Serverfehler '+r.status);
    return r.json();
  }
  throw new Error('Zu viele Anfragen – bitte kurz warten.');
}
function norm(raw){let s=String(raw).trim().replace(/\s+/g,'');if(!s)return'';if(!/-\d+$/.test(s))s+='-1';return s}
async function fetchSet(num){
  const e=encodeURIComponent(num);
  const s=await api(`/sets/${e}/`);
  const rows=[];let url=`/sets/${e}/parts/?page_size=1000&inc_minifig_parts=1`;
  while(url){const d=await api(url);rows.push(...d.results);url=d.next}
  let theme=S.themes[s.theme_id];
  if(!theme&&s.theme_id){try{theme=(await api(`/themes/${s.theme_id}/`)).name;S.themes[s.theme_id]=theme;putMeta('themes',S.themes)}catch(_){}}
  const m=new Map();
  for(const r of rows){
    const k=r.part.part_num+'|'+r.color.id+'|'+(r.is_spare?1:0);
    if(m.has(k)){m.get(k).qty+=r.quantity;continue}
    const ce=r.color.external_ids&&r.color.external_ids.BrickLink,pe=r.part.external_ids&&r.part.external_ids.BrickLink;
    m.set(k,{k,pn:r.part.part_num,name:r.part.name,img:r.part.part_img_url||'',url:r.part.part_url||'',cid:r.color.id,cname:r.color.name,rgb:r.color.rgb||'cccccc',qty:r.quantity,spare:!!r.is_spare,blp:pe&&pe[0]||'',blc:ce&&ce.ext_ids&&ce.ext_ids.length?ce.ext_ids[0]:null});
  }
  return{set_num:s.set_num,name:s.name,year:s.year,num_parts:s.num_parts,img:s.set_img_url||'',url:s.set_url||'',theme:theme||'',parts:[...m.values()]};
}

/* ---------- Logik ---------- */
function prog(s){let n=0,h=0;for(const p of s.parts){if(p.spare)continue;n+=p.qty;h+=Math.min(s.have[p.k]||0,p.qty)}return{n,h,pct:n?Math.floor(h/n*100):0}}
const base=n=>n.replace(/-\d+$/,'');
const stLabel={offen:'offen',arbeit:'in Arbeit',komplett:'komplett'};
function toast(msg,err){const t=$('#toast');t.textContent=msg;t.className='toast'+(err?' err':'');t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=true,err?6000:3200)}
function setBusy(m){busyMsg=m;const b=$('#busy');if(b)b.textContent=m}
async function addSets(list){
  for(const raw of list){
    const num=norm(raw);if(!num)continue;
    if(S.sets[num]){toast(num+' ist schon erfasst');continue}
    setBusy(`Lade ${num} …`);
    try{const d=await fetchSet(num);const s={...d,status:'offen',manual:true,note:'',link:'',have:{},added:Date.now()};S.sets[s.set_num]=s;putSet(s);toast(`${s.set_num} „${s.name}“ erfasst – ${s.parts.length} Teilepositionen`)}
    catch(e){toast(num+': '+e.message,true)}
    if(view==='sets')render();
  }
  setBusy('');if(view==='sets')render();
}
function dl(name,text,type){const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800)}

/* ---------- Ansichten ---------- */
function vSets(){
  const all=Object.values(S.sets);
  if(!S.key)return`<div class="panel empty"><h2>Los geht's in zwei Minuten</h2>
    <ol class="steps" style="text-align:left;max-width:560px;margin:12px auto">
    <li>Kostenloses Konto bei <a href="https://rebrickable.com/signup/" target="_blank" rel="noopener">rebrickable.com</a> anlegen.</li>
    <li>Unter <a href="https://rebrickable.com/api/" target="_blank" rel="noopener">rebrickable.com/api</a> → „Generate new API key“ einen Schlüssel erzeugen.</li>
    <li>Schlüssel unter <b>Einstellungen</b> eintragen – fertig.</li></ol>
    <button class="btn y" data-act="go" data-v="settings">Zu den Einstellungen</button></div>`;
  let tot=0,hv=0,done=0;for(const s of all){const p=prog(s);tot+=p.n;hv+=p.h;if(p.pct===100||s.status==='komplett')done++}
  let list=all.filter(s=>(!filt.st||s.status===filt.st)&&(!filt.q||(s.set_num+' '+s.name+' '+s.theme+' '+s.year).toLowerCase().includes(filt.q.toLowerCase())));
  const P=new Map(list.map(s=>[s.set_num,prog(s).pct]));
  const sorts={near:(a,b)=>((P.get(b.set_num)===100?-1:P.get(b.set_num))-(P.get(a.set_num)===100?-1:P.get(a.set_num))),pct:(a,b)=>P.get(b.set_num)-P.get(a.set_num),num:(a,b)=>a.set_num.localeCompare(b.set_num,'de',{numeric:true}),year:(a,b)=>a.year-b.year,added:(a,b)=>b.added-a.added,theme:(a,b)=>(a.theme||'').localeCompare(b.theme||'')};
  list.sort(sorts[filt.sort]||sorts.near);
  return`<div class="panel"><h2>Sets erfassen</h2>
   <div class="bar"><input class="grow" id="nums" placeholder="Setnummern, z. B. 6080, 10305, 8880-1 (mehrere mit Komma)"><button class="btn y" data-act="add">Hinzufügen</button></div>
   <div class="bar" style="margin:0"><input class="grow" id="sq" placeholder="Oder nach Name suchen, z. B. „Burg“ oder „Galaxy Explorer“"><button class="btn ghost" data-act="find">Suchen</button><span class="busy" id="busy">${esc(busyMsg)}</span></div>
   <div class="res" id="res">${searchRes.map(r=>`<div class="ritem"><div class="rim" data-act="zoom" data-src="${esc(r.set_img_url||'')}">${r.set_img_url?`<img loading="lazy" src="${esc(r.set_img_url)}" alt="">`:''}</div><div><b>${esc(r.set_num)}</b> ${esc(r.name)}<div class="sub">${r.year} · ${r.num_parts} Teile</div></div>${S.sets[r.set_num]?'<span class="sub">erfasst</span>':`<button class="btn" data-act="addone-set" data-n="${esc(r.set_num)}">+ Erfassen</button>`}</div>`).join('')}</div></div>

const photo={mode:'parts',busy:false,res:null,err:'',prev:''};
async function shrink(f){try{const im=await createImageBitmap(f);const sc=Math.min(1,1280/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(b=>r(b||f),'image/jpeg',.9))}catch(_){return f}}
async function recognize(files){
  files=[...files].filter(f=>f.type.startsWith('image/')).slice(0,4);if(!files.length)return;
  if(photo.prev)URL.revokeObjectURL(photo.prev);
  Object.assign(photo,{busy:true,err:'',res:null,prev:URL.createObjectURL(files[0])});render();
  try{const fd=new FormData();for(const f of files)fd.append('query_image',await shrink(f),'foto.jpg');
    const ep={auto:'',parts:'parts/',sets:'sets/',figs:'figs/'}[photo.mode];
    let r;try{r=await fetch('https://api.brickognize.com/predict/'+ep,{method:'POST',body:fd})}catch(_){throw new Error('Der Erkennungsdienst ist von hier aus nicht erreichbar. Alternativ das Foto direkt auf brickognize.com hochladen.')}
    if(!r.ok)throw new Error('Erkennung fehlgeschlagen (Fehler '+r.status+'). Anderes Foto oder anderen Modus probieren.');
    photo.res=((await r.json()).items||[]).slice(0,6)}
  catch(e){photo.err=e.message}
  photo.busy=false;if(view==='photo')render();
}
function ownMatches(id){const out=[];for(const s of Object.values(S.sets))for(const x of s.parts){if(x.spare)continue;if(x.pn===id||x.blp===id)out.push({s,x,have:s.have[x.k]||0})}return out.sort((a,b)=>(b.x.qty-b.have)-(a.x.qty-a.have))}
function predHtml(it){
  const sc=Math.round((it.score||0)*100),ext=(it.external_sites||[]).map(e=>`<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.name)}</a>`).join(' · ');

function missItems(){
  let sets=Object.values(S.sets);
  if(mscope==='open')sets=sets.filter(s=>s.status!=='komplett');else if(mscope==='arbeit')sets=sets.filter(s=>s.status==='arbeit');else if(mscope!=='all')sets=sets.filter(s=>s.set_num===mscope);
  const m=new Map();
  for(const s of sets)for(const x of s.parts){if(x.spare)continue;const d=x.qty-(s.have[x.k]||0);if(d<=0)continue;
    const k=x.pn+'|'+x.cid;if(!m.has(k))m.set(k,{...x,miss:0,in:[]});const o=m.get(k);o.miss+=d;o.in.push(s.set_num)}
  return[...m.values()].sort((a,b)=>b.miss-a.miss);
}

document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
  if(a==='open'){e.preventDefault();cur=t.dataset.n;view='set';pf.q='';render();scrollTo(0,0);return}
  if(a==='zoom'){const src=t.dataset.src;if(!src)return;const z=document.createElement('div');z.className='zoom';z.innerHTML=`<img src="${esc(src)}" alt="">`;z.onclick=()=>z.remove();document.body.append(z);return}
  if(a==='pmode'){photo.mode=t.dataset.m;render();return}
  if(a==='pick'){$('#phf').click();return}
  if(a==='go'){view=t.dataset.v;render();scrollTo(0,0);return}
  if(a==='add'){const v=$('#nums').value;$('#nums').value='';addSets(v.split(/[,;\n]+/));return}
  if(a==='addone-set'){addSets([t.dataset.n]);return}
  if(a==='find'){const q=$('#sq').value.trim();if(!q)return;setBusy('Suche …');try{const d=await api(`/sets/?search=${encodeURIComponent(q)}&page_size=24&ordering=-year`);searchRes=d.results;if(!searchRes.length)toast('Nichts gefunden')}catch(err){toast(err.message,true)}setBusy('');render();return}
  const s=S.sets[cur];
  if(['dec','inc','full'].includes(a)&&s){const tr=t.closest('tr'),k=tr.dataset.k,x=s.parts.find(p=>p.k===k),h=s.have[k]||0;setHave(k,a==='dec'?h-1:a==='inc'?h+1:x.qty,tr);return}
  if(a==='allhave'&&s){for(const x of s.parts)s.have[x.k]=x.qty;save(s);render();updProg();return}
  if(a==='reset'&&s){if(delArm!==2){delArm=2;t.textContent='Wirklich alles auf 0?';setTimeout(()=>{delArm=0;if(t.isConnected)t.textContent='Zurücksetzen'},4000);return}delArm=0;s.have={};s.status='offen';save(s);render();return}
  if(a==='del'&&s){if(delArm!==1){delArm=1;t.textContent='Wirklich löschen?';t.classList.add('red');setTimeout(()=>{delArm=0;if(t.isConnected){t.textContent='Set löschen';t.classList.remove('red')}},4000);return}delArm=0;delete S.sets[cur];delSet(cur);view='sets';render();toast('Set gelöscht');return}
  if(a==='reload'&&s){t.disabled=true;t.textContent='Lade …';try{const d=await fetchSet(s.set_num);Object.assign(s,d);save(s);render();toast('Katalogdaten aktualisiert – deine Zählung bleibt erhalten')}catch(err){toast(err.message,true);t.disabled=false;t.textContent='Katalogdaten neu laden'}return}
  if(a==='missof'&&s){mscope=s.set_num;view='missing';render();scrollTo(0,0);return}
  if(a==='plus1'){const o=S.sets[t.dataset.n];const x=o&&o.parts.find(p=>p.k===t.dataset.k);if(!x)return;o.have[x.k]=Math.min(x.qty,(o.have[x.k]||0)+1);if(prog(o).h>0&&o.status==='offen')o.status='arbeit';save(o);toast(`+1 in ${o.set_num} „${o.name}“`);if(view!=='search'){render();return}$('#sres').outerHTML=new DOMParser().parseFromString(vSearch(),'text/html').querySelector('#sres').outerHTML;return}
  if(a==='xbl'||a==='xrb'||a==='xcp'){const it=missItems(),tag=mscope.replace(/[^\w-]/g,'');
    if(a==='xbl'){dl(`fehlteile-${tag}.xml`,'<INVENTORY>\n'+it.map(i=>`<ITEM><ITEMTYPE>P</ITEMTYPE><ITEMID>${esc(i.blp||i.pn)}</ITEMID>${i.blc!=null?`<COLOR>${i.blc}</COLOR>`:''}<MINQTY>${i.miss}</MINQTY></ITEM>`).join('\n')+'\n</INVENTORY>\n','application/xml');toast('XML gespeichert – bei BrickLink unter „Wanted → Upload“ einfügen')}
    else if(a==='xrb'){dl(`fehlteile-${tag}.csv`,'Part,Color,Quantity\n'+it.map(i=>`${i.pn},${i.cid},${i.miss}`).join('\n')+'\n','text/csv');toast('CSV gespeichert – bei Rebrickable als Teileliste importierbar')}
    else{const txt=it.map(i=>`${i.miss}× ${i.pn} ${i.name} (${i.cname})`).join('\n');try{await navigator.clipboard.writeText(txt);toast('Liste kopiert')}catch(_){toast('Kopieren nicht erlaubt – bitte Export nutzen',true)}}return}
  if(a==='savekey'){S.key=$('#key').value.trim();putMeta('key',S.key);if(!S.key){toast('Schlüssel entfernt');return}t.disabled=true;try{await api('/colors/?page_size=1');toast('Schlüssel funktioniert – leg los!')}catch(err){toast(err.message,true)}t.disabled=false;return}
  if(a==='exp'){flush();dl(`steinwerk-sicherung-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify({app:'steinwerk',v:1,sets:Object.values(S.sets)}),'application/json');return}
  if(a==='imp'){$('#imp').click();return}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){const id=e.target.id;if(id==='nums')document.querySelector('[data-act=add]').click();if(id==='sq')document.querySelector('[data-act=find]').click();if(e.target.classList.contains('card'))e.target.click()}});
document.addEventListener('change',e=>{const t=e.target,s=S.sets[cur];
  if(t.dataset.act==='setq'&&s){setHave(t.closest('tr').dataset.k,+t.value,t.closest('tr'));return}
  if(t.dataset.f&&s){s[t.dataset.f]=t.type==='checkbox'?t.checked:t.value;save(s);if(t.dataset.f==='link')render();return}
  if(t.id==='fst'){filt.st=t.value;render()}if(t.id==='fso'){filt.sort=t.value;render()}
  if(t.id==='pso'){pf.sort=t.value;render()}if(t.id==='pmi'){pf.miss=t.checked;render()}if(t.id==='psp'){pf.spare=t.checked;render()}
  if(t.id==='msc'){mscope=t.value;render()}
});
let inT;
document.addEventListener('input',e=>{const t=e.target;if(!['fq','pq','sqi'].includes(t.id))return;clearTimeout(inT);inT=setTimeout(()=>{
  if(t.id==='fq')filt.q=t.value;if(t.id==='pq')pf.q=t.value;if(t.id==='sqi')sq=t.value;
  const pos=t.selectionStart;render();const n=document.getElementById(t.id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}},250)});
$('#phf').addEventListener('change',e=>{recognize(e.target.files);e.target.value=''});
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('#drop');if(!d)return;e.preventDefault();d.classList.add('over')});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('#drop');if(!d)return;e.preventDefault();d.classList.remove('over');recognize(e.dataTransfer.files)});
document.addEventListener('paste',e=>{if(view!=='photo')return;const f=[...(e.clipboardData?.files||[])];if(f.length)recognize(f)});
$('#imp').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.sets))throw 0;let c=0;for(const s of d.sets){if(!s.set_num||!Array.isArray(s.parts))continue;s.have=s.have||{};S.sets[s.set_num]=s;putSet(s);c++}toast(c+' Sets eingespielt');render()}catch(_){toast('Datei ist keine gültige Steinwerk-Sicherung',true)}e.target.value=''});

/* ---------- Start ---------- */
(async()=>{db=await openDB();S.key=(await getMeta('key'))||'';S.themes=(await getMeta('themes'))||{};for(const s of await getAll())S.sets[s.set_num]=s;
  if(!db)toast('Browser-Speicher nicht verfügbar – Daten gehen beim Schließen verloren. Bitte Sicherung nutzen.',true);render()})();
}
</script></body></html>
